# Package changelog, in goreleaser/chglog format. nfpm reads this via the `changelog:`
# key in nfpm.yaml and renders it into the package's changelog.Debian.gz.
#
# Keep this in sync with CHANGELOG.md by hand -- that file is the human-facing record in
# Keep a Changelog format, and nfpm cannot read Markdown. Nothing enforces the match.
#
# Keep each `note` on a SINGLE line. chglog renders every subsequent line of a note as a
# "-" sub-bullet, which makes a wrapped sentence look like a broken list.
- semver: 0.0.4
  date: 2026-09-01T00:00:00Z
  packager: Chris <chris@example.com>
  changes:
    - note: "Stop release.yaml racing itself, and fail loudly"

- semver: 0.0.3
  date: 2026-09-01T00:00:00Z
  packager: Chris <chris@example.com>
  changes:
    - note: "Add a dispatchable version-release workflow"
    - note: "Drop the unused hash variable in generate-changelog.sh"
    - note: "Restart the daemon on upgrade"

- semver: 0.0.2
  date: 2026-09-01T00:00:00Z
  packager: Chris <chris@example.com>
  changes:
    - note: "The daemon now re-reads its config without a restart: it watches the config file with inotify, and also reloads on SIGHUP via `systemctl --user reload retrosaver`."
    - note: "A reload behaves like user activity -- any module on screen is torn down and the stages re-arm from zero."
    - note: "A config that fails to parse is not applied; the previous settings stay in force so a typo cannot cost you both the screensaver and the auto-lock."

- semver: 0.0.1
  date: 2026-09-01T00:00:00Z
  packager: Chris <chris@example.com>
  changes:
    - note: "First release: an idle daemon that runs classic XScreenSaver display modules on GNOME under Wayland, driven by org.gnome.Mutter.IdleMonitor."
    - note: "Three stages timed from idle, each torn down and re-armed by any user activity: a random module fullscreen at 5 minutes, GNOME's lock screen at 20, display off at 22."
    - note: "One static binary with six subcommands: daemon, run, stop, list, setup, teardown."
    - note: "Per-user installation lives in `retrosaver setup` and `teardown`, not in maintainer scripts, because enabling a systemd --user unit needs the user's own session bus."
    - note: "Not a screen locker, and cannot be one under XWayland; the lock stage hands off to GNOME's own lock screen."
    - note: "Note that setup sets idle-delay to 0, so there is no auto-lock while the daemon is not running."

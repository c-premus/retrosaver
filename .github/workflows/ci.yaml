name: CI

# The public mirror's own CI. The canonical pipeline lives on the upstream
# Forgejo instance; this exists so that forks build and contributor pull
# requests opened here get checked, which a mirror with no workflows cannot do.
#
# Deliberately NOT a copy of the upstream file. The privacy guard that runs
# upstream must never appear here: its pattern names the private hostnames it
# guards, so publishing it would leak exactly what it exists to protect.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The Go language floor we INTEND, pinned here so a change to it has to be a
  # deliberate edit by a human. go.mod's `go` directive is checked against this
  # below, and the floor build below runs GOTOOLCHAIN=go$GO_FLOOR, so the pin is
  # executed rather than merely compared.
  #
  # Four places carry this number and must move in one commit: go.mod, this pin
  # (and its upstream counterpart), docs/development.md's "Code standards", and
  # the upstream Renovate rule barring the `golang` depType.
  GO_FLOOR: "1.26.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go.mod carries TWO Go versions and they mean different things, so this
      # runs before setup-go: it needs no toolchain and reports in seconds.
      #
      # `toolchain` is what BUILDS. `go` is a language FLOOR that deliberately
      # lags it, so a host with an older Go and no toolchain download still
      # builds under GOTOOLCHAIN=local.
      #
      # The floor is NOT set by our code -- a module's directive must be at
      # least its dependencies', and golang.org/x/sys keeps raising its own.
      # It has moved the floor twice, neither time by anyone's decision:
      #
      #   x/sys v0.44.0 declares go 1.25.0  ->  floor 1.24 -> 1.25.0
      #   x/sys v0.48.0 declares go 1.26.0  ->  floor 1.25.0 -> 1.26.0
      #
      # A `go mod tidy` run performs them, the first as a side effect of a
      # security bump.
      #
      # So the first check below is the one that matters, and it is NOT a
      # floor-versus-toolchain comparison: that stayed green through BOTH
      # raises (1.25.0 <= 1.27.1, then 1.26.0 <= 1.27.1). Only pinning the
      # expected floor catches one, because `go mod tidy` can rewrite go.mod
      # but cannot edit a workflow. The ordering check is kept as well, because
      # a floor above the toolchain breaks the offline host outright.
      - name: Go floor agreement (GATE)
        run: |
          set -o errexit -o nounset -o pipefail
          FLOOR=$(sed -n 's/^go \([0-9][0-9.]*\)[[:space:]]*$/\1/p' go.mod)
          TOOLCHAIN=$(sed -n 's/^toolchain go\([0-9][0-9.]*\)[[:space:]]*$/\1/p' go.mod)
          if [ -z "$FLOOR" ] || [ -z "$TOOLCHAIN" ]; then
            echo "::error::Could not parse go.mod (floor '$FLOOR', toolchain '$TOOLCHAIN') -- this guard's sed patterns have drifted from the file format. Fix the guard; do not delete it." >&2
            exit 1
          fi
          if [ "$FLOOR" != "$GO_FLOOR" ]; then
            echo "::error::go.mod's language floor is 'go $FLOOR' but this workflow pins GO_FLOOR=$GO_FLOOR. If a dependency raised it transitively (go mod tidy does this silently), decide whether to accept the raise -- then move go.mod, this pin and docs/development.md together." >&2
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$FLOOR" "$TOOLCHAIN" | sort -V | head -1)" != "$FLOOR" ]; then
            echo "::error::go.mod's language floor (go $FLOOR) is newer than the toolchain it builds with (go$TOOLCHAIN). The floor must lag -- it exists for hosts that cannot download a toolchain." >&2
            exit 1
          fi
          echo "Go floor agrees: floor=$FLOOR pin=$GO_FLOOR toolchain=$TOOLCHAIN"

      # go-version-file, not a literal version. setup-go prefers go.mod's
      # `toolchain` directive over `go` when both are present, so this builds
      # with exactly the toolchain go.mod names rather than whatever patch
      # release setup-go happens to resolve. go.mod's `go` line stays what it
      # says it is: a language floor, not a build version.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (GATE)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # The dependency rule in docs/development.md is "exactly three direct
      # dependencies, all pure Go". This is the only thing enforcing it:
      # -diff fails without writing, so an untidy or newly-grown go.mod cannot
      # merge unnoticed.
      - name: go mod tidy (GATE)
        run: go mod tidy -diff

      # CGO_ENABLED=0 only here: the shipped artifact must be static. Tests
      # below run with cgo enabled so -race works.
      - name: go build (GATE)
        run: CGO_ENABLED=0 go build ./...

      # release.yaml ships an arm64 .deb, but nothing else here ever compiles
      # for it, so an arch-specific break would first surface at release time.
      - name: go build arm64 (GATE)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...

      # The floor is a promise to a host we never build on. Until this step it
      # rested on a one-off manual note, which went stale the moment the floor
      # moved -- go.mod claimed a go1.24.12 verification while declaring 1.25.0.
      # Building at the floor turns the promise into something CI re-proves
      # every run, and it is what catches new code using a language or stdlib
      # feature the floor does not have (the failure the floor exists to
      # prevent, and the one `go build` with the toolchain cannot see).
      #
      # This downloads GO_FLOOR's toolchain, so it deliberately does NOT model
      # the GOTOOLCHAIN=local host; it models the LANGUAGE VERSION that host
      # compiles at, which is the half that regresses. No -race: cgo is off for
      # the same reason as the build gates, and -race is already covered below.
      - name: go build at the floor (GATE)
        run: |
          set -o errexit -o nounset -o pipefail
          GOTOOLCHAIN="go${GO_FLOOR}" go build ./...
          GOTOOLCHAIN="go${GO_FLOOR}" go test ./...

      - name: go vet (GATE)
        run: go vet ./...

      - name: go test (GATE)
        run: go test -race ./...

      # Pinned, never @latest: a linter release must not be able to redden a
      # pull request that changed nothing.
      #
      # golangci-lint running staticcheck only (.golangci.yml), not standalone
      # staticcheck. The analysers are the same, but golangci-lint builds them
      # against a current golang.org/x/tools, and staticcheck's own releases
      # pin an x/tools that lags Go's export data format: staticcheck 2026.2.1
      # cannot read Go 1.27.2's export data v5.
      - name: golangci-lint (GATE)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

      # Catches vulnerabilities reachable from this module's own code, including
      # the Go standard library compiled into the shipped binary. Automated
      # dependency updates cannot cover that case: stdlib advisories file under
      # OSV package `stdlib`, which matches no dependency name, so nothing
      # keyed on the module graph will ever raise one.
      #
      # Pinned rather than @latest, like golangci-lint above. Note the pin covers
      # the tool, not the vulnerability database -- that floats by design, so
      # unlike the linter this gate can legitimately fail a pull request that
      # changed nothing, when a new advisory is published.
      - name: govulncheck (GATE)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: shellcheck (GATE)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # git ls-files, not a hardcoded list: a new script must not be
          # able to ship unchecked just because nobody updated this line.
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'checking %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"
          bash -n tests/smoke.sh

      # The settings app (gui/, packaged as retrosaver-gtk). Its logic is
      # tested without GTK, so the runner needs no display and no GTK
      # bindings; the desktop entry and AppStream metainfo are checked by the
      # same validators GNOME Software and the distributions use. The .deb
      # itself is built and listed by release.yaml's "Verify package metadata".
      - name: settings app (GATE)
        run: |
          sudo apt-get install -y desktop-file-utils appstream
          python3 -m py_compile gui/retrosaver-settings
          python3 -m unittest discover -s gui -v
          desktop-file-validate gui/us.prem.Retrosaver.desktop
          appstreamcli validate --no-net gui/us.prem.Retrosaver.metainfo.xml

  # The settings app's window tests drive a real GTK window under Xvfb. They
  # need libadwaita 1.2 or newer, which the Ubuntu 22.04 runner image lacks
  # (it has 1.1), so this job runs in Debian bookworm, whose 1.2.2 is exactly
  # the app's floor: a call newer than that fails here first. The node image
  # is bookworm with the Node that checkout and setup-go need.
  #
  # Not one of the required Build checks, but it is part of main's combined
  # status, so the nightly release will not ship while it is red.
  window:
    name: Settings app window
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm@sha256:82693da96a4e38b8c0e2bf0c5df58fcb86d2d25e5a235c07748f09bfa38567c2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install GTK, libadwaita and a display
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth xscreensaver-data
          dpkg-query -W gir1.2-adw-1 gir1.2-gtk-4.0

      # A window test skips without GTK or a display, which is right on a
      # packager's machine and wrong here: a run that skipped them would be
      # green while testing nothing. So the step also fails on any skip.
      - name: window tests (GATE)
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          # In a job container the checkout can belong to another uid than the
          # one running the step (GitHub's does), and git then refuses the
          # repository as "dubious ownership" -- which `go build` reports as
          # "error obtaining VCS status: exit status 128". Trusting the
          # workspace keeps the commit stamp; -buildvcs=false would drop it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CGO_ENABLED=0 go build -o /tmp/retrosaver ./cmd/retrosaver
          RETROSAVER_BIN=/tmp/retrosaver xvfb-run -a \
            python3 -m unittest discover -s gui -v 2>&1 | tee /tmp/window.log
          if grep -q 'skipped' /tmp/window.log; then
            echo "::error::window tests were skipped; see the log above"
            exit 1
          fi
          # GLib reports misuse (a call on an object already torn down, say) as
          # a CRITICAL and carries on, so a test can pass over one.
          if grep -q 'CRITICAL' /tmp/window.log; then
            echo "::error::GLib CRITICAL during the window tests; see the log above"
            exit 1
          fi

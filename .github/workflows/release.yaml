name: Release

# Builds the public release artifacts on the mirror itself, so that what a user
# downloads is produced from the source they can read, by a run they can
# inspect. The upstream Forgejo release workflow publishes to its own registry
# and is not the source of these files.

on:
  push:
    tags:
      - "v*"
  # Recovery hatch: re-run a release without re-pushing its tag, or, on main,
  # republish the apt repository alone.
  workflow_dispatch:

permissions:
  contents: write
  # Both required by attest-build-provenance.
  id-token: write
  attestations: write

# Per-tag, not global. The upstream mirror sync force-pushes every tag on every run,
# and a change to its redaction rules moves every SHA at once -- which GitHub
# sees as N updated tags and fires N release runs. Grouping per tag keeps each
# one serialized against a re-run of itself without having them cancel each
# other. The idempotent release creation below is the other half of that.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    # The version comes from the tag, so there is nothing to build on a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      NFPM_VERSION: "2.48.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Derive version from tag
        id: version
        run: |
          # refs/tags/v1.2.3 -> 1.2.3
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      # SOURCE_DATE_EPOCH is the commit date of the tagged commit, so nfpm
      # stamps the .deb deterministically instead of using "now". Without it
      # two builds of the same tag differ in their ar member timestamps and in
      # the mtimes inside data.tar, and nobody can reproduce a published .deb.
      #
      # This still does not make builds byte-identical across different Go
      # patch releases -- Go stamps vcs.revision/vcs.time into main packages
      # and -trimpath does not strip them -- so compare packaging metadata,
      # not hashes.
      - name: Derive SOURCE_DATE_EPOCH from the tagged commit
        run: |
          EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$EPOCH" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$EPOCH ($(date -u -d "@$EPOCH" +%FT%TZ))"

      # Static by construction: godbus is pure Go, so CGO_ENABLED=0 yields a
      # binary with no glibc coupling. That is what makes the single-artifact
      # distribution real rather than aspirational.
      - name: Build binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
                -o "dist/retrosaver-linux-$arch" ./cmd/retrosaver
          done
          file dist/* || true

          # nfpm does not compress man pages, and Debian wants them gzipped.
          # -n omits the timestamp so the result is reproducible.
          gzip -9 -n -c docs/retrosaver.1 > dist/retrosaver.1.gz
          gzip -9 -n -c docs/retrosaver-settings.1 > dist/retrosaver-settings.1.gz

      - name: Install nfpm
        run: |
          curl -sSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      # nfpm does NOT expand environment variables inside contents[].src, so the
      # binary is staged at the fixed path nfpm.yaml names. Verified against
      # nfpm v2.47.0: a ${GOARCH} in src fails with "Glob failed".
      - name: Build .deb packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            cp "dist/retrosaver-linux-$arch" dist/retrosaver
            GOARCH="$arch" nfpm pkg --packager deb --target dist/
          done
          rm -f dist/retrosaver
          # The settings app is Architecture: all, so it is built once.
          nfpm pkg --config nfpm-gtk.yaml --packager deb --target dist/
          ls -la dist/

      - name: Verify package metadata
        run: |
          for deb in dist/*.deb; do
            echo "=== $deb"
            dpkg-deb --info "$deb" | grep -E 'Depends|Conflicts|Architecture|Version|Homepage'
            dpkg-deb --contents "$deb"
          done

      # Provenance for the five published files. Cheap, and it lets anyone
      # verify a downloaded .deb came from this repo and this workflow:
      #   gh attestation verify retrosaver_X.Y.Z_amd64.deb -R c-premus/retrosaver
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.deb, dist/retrosaver-linux-*"

      # Idempotent by construction. A run can legitimately be the second for one
      # tag: a workflow_dispatch re-run after a partial failure, or a tag that
      # the upstream mirror sync force-updated. Creating a release that already exists
      # is an error, so reuse it; --clobber replaces an asset rather than
      # failing or attaching a second copy under the same name.
      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          TAG="${GITHUB_REF#refs/tags/}"

          # The body is the version's CHANGELOG.md section plus install
          # instructions, from the same script the upstream release uses.
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; reusing it."
            # Refresh the notes too, so a re-run picks up a CHANGELOG section
            # edited after the release. A tag that predates release-notes.sh
            # runs its own older copy of this file, so set its notes by hand.
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
            echo "Created release ${TAG}"
          fi

          gh release upload "$TAG" --clobber \
            dist/*.deb dist/retrosaver-linux-amd64 dist/retrosaver-linux-arm64

          # Assert the finished state rather than trusting the exit codes above.
          # A green run that published nothing is the failure mode worth
          # spending a few lines to rule out.
          count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          echo "Release ${TAG} has ${count} assets."
          # Two daemon .debs, the settings app's .deb, two raw binaries.
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 assets, found ${count}"
            exit 1
          fi

  # The apt repository at https://retrosaver.prem.us, rebuilt from
  # every release's .debs and deployed to GitHub Pages.
  #
  # Chained with `needs`, not a separate `on: release` workflow: a release
  # created with GITHUB_TOKEN triggers no other workflow, so that one would
  # never run. A Pages deploy replaces the whole site, so the repository is
  # rebuilt from ALL releases each time, never appended to.
  #
  # A dispatch on main skips `release` and runs only this job: that republishes
  # the repository without rebuilding any release. Dispatching on an old tag
  # cannot do it, because the dispatch runs this file as of that tag.
  apt-repo:
    name: Publish apt repository
    needs: release
    # Run when `release` succeeded or was skipped, never when it failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # The environment's deployment rules allow `v*` tags and `main`; any
    # other ref is rejected before this job starts.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deploy at a time across all tags. When the mirror sync re-pushes
    # every tag at once, the queued runs collapse to the newest and the rest
    # show as cancelled -- expected, since each rebuild is the same repository.
    concurrency:
      group: apt-repo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download every release's packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          mkdir -p site/pool/main
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | while read -r tag; do
                gh release download "$tag" --pattern '*.deb' --dir site/pool/main --clobber
              done
          ls -la site/pool/main

      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y apt-utils
          scripts/build-apt-repo.sh site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

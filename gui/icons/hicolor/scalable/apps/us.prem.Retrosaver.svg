<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e2d0"/>
      <stop offset="1" stop-color="#c9c0a8"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.45" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#1c3b5a"/>
      <stop offset="1" stop-color="#070d1a"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e01b24"/>
      <stop offset="0.5" stop-color="#ff7800"/>
      <stop offset="1" stop-color="#f6d32d"/>
    </linearGradient>
  </defs>
  <!-- stand -->
  <path d="M44 100h40l6 14H38z" fill="#9a9178"/>
  <rect x="30" y="110" width="68" height="8" rx="4" fill="#77705c"/>
  <!-- case -->
  <rect x="10" y="14" width="108" height="90" rx="14" fill="#a39a80"/>
  <rect x="10" y="12" width="108" height="88" rx="14" fill="url(#case)"/>
  <!-- screen -->
  <rect x="20" y="21" width="88" height="66" rx="10" fill="#5e5c64"/>
  <rect x="23" y="24" width="82" height="60" rx="8" fill="url(#glass)"/>
  <!-- a flame-style fractal swirl -->
  <g fill="none" stroke="url(#flame)" stroke-linecap="round">
    <path d="M64 54c0-8 10-10 14-4s-2 16-12 16-18-8-17-18 12-19 24-17" stroke-width="4"/>
    <path d="M64 54c0 6-8 8-11 3s2-12 9-12" stroke-width="3" opacity="0.8"/>
  </g>
  <circle cx="40" cy="36" r="1.6" fill="#ffffff" opacity="0.8"/>
  <circle cx="90" cy="70" r="1.4" fill="#ffffff" opacity="0.7"/>
  <circle cx="86" cy="34" r="1" fill="#ffffff" opacity="0.6"/>
  <!-- glare -->
  <path d="M29 30c10-4 30-5 44-3" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.15" fill="none"/>
  <!-- power light -->
  <circle cx="102" cy="94" r="2.5" fill="#33d17a"/>
</svg>

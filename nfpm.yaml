# nfpm packaging manifest. Built by the release workflow in CI:
#   cp dist/retrosaver-linux-amd64 dist/retrosaver
#   VERSION=1.2.3 GOARCH=amd64 nfpm pkg --packager deb --target dist/
#
# The binary is staged at a FIXED path because nfpm does not expand environment
# variables inside contents[].src -- a ${GOARCH} there fails with
# "Glob failed: no matching files". Verified against nfpm v2.47.0.
name: retrosaver
arch: ${GOARCH}
version: ${VERSION}
section: x11
priority: optional
maintainer: Chris <63758245+c-premus@users.noreply.github.com>
description: |
  Retro screensavers for GNOME on Wayland.
  Brings back late-1990s XScreenSaver display modules (fractals, the atlantis
  fish tank, flying toasters, spinning pipes) on GNOME desktops running
  Wayland, where the traditional screensaver daemon no longer functions.
  Reuses the XScreenSaver display modules Debian and Ubuntu already package and
  supplies only the idle trigger GNOME dropped.
vendor: Chris
homepage: https://github.com/c-premus/retrosaver
license: MIT

# Rendered into the package's changelog.Debian.gz. This is goreleaser/chglog format,
# NOT Markdown -- keep it in sync with CHANGELOG.md by hand.
changelog: ./changelog.yaml

# Narrow on purpose. Per-user installation stays in `retrosaver setup`, which
# needs the user's session bus and their consent. The postinst only refreshes
# systemd's unit cache and restarts an already-running daemon, so an upgrade
# does not leave the old binary running with /proc/<pid>/exe as "(deleted)".
scripts:
  postinstall: ./scripts/postinstall.sh

depends:
  # The display modules themselves. Hard dependencies so the tool works
  # immediately after install: atlantis lives in -gl-extra, flame and ifs in
  # -data-extra. Pulls roughly 40 MB including netpbm and libjpeg-turbo-progs.
  - xscreensaver-data
  - xscreensaver-data-extra
  - xscreensaver-gl
  - xscreensaver-gl-extra
  # EWMH fullscreen/above, pointer hiding over the saver window, and bounded
  # window discovery. xdotool is what makes `search --sync --pid` possible, so
  # internal/window waits for the module's window to map instead of polling.
  # Note the pointer-hiding binary is unclutter-xfixes, NOT unclutter: this
  # package ships /usr/bin/unclutter-xfixes and declares no Provides: unclutter.
  - wmctrl
  - unclutter-xfixes
  - xdotool

conflicts:
  # The xscreensaver DAEMON is the broken component: it does not work under
  # GNOME's compositor, and it tries to autostart and emit errors. This package
  # replaces it, so installing both is incoherent. The module DATA packages
  # above are a separate, and required, matter.
  - xscreensaver

contents:
  - src: ./dist/retrosaver
    dst: /usr/bin/retrosaver
    file_info:
      mode: 0755

  # Shipped, but deliberately NOT enabled by the package. Enabling a
  # systemd --user unit and taking ownership of idle-delay are per-user
  # operations needing the user's session bus; a root postinst cannot do them
  # correctly. The user runs `retrosaver setup` instead.
  - src: ./systemd/retrosaver.service
    dst: /usr/lib/systemd/user/retrosaver.service
    file_info:
      mode: 0644

  - src: ./config/retrosaver.conf.example
    dst: /usr/share/retrosaver/retrosaver.conf.example
    file_info:
      mode: 0644

  - src: ./LICENSE
    dst: /usr/share/doc/retrosaver/copyright
    file_info:
      mode: 0644

  # Debian Policy 12.1 wants a manual page for every program in /usr/bin. nfpm does
  # not compress man pages, so release.yaml gzips it into dist/ before packaging.
  - src: ./dist/retrosaver.1.gz
    dst: /usr/share/man/man1/retrosaver.1.gz
    file_info:
      mode: 0644

  # Without this an apt-installed user has `retrosaver help` and nothing else.
  - src: ./README.md
    dst: /usr/share/doc/retrosaver/README.md
    file_info:
      mode: 0644
